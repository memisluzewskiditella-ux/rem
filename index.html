<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>rem. · Bienestar doméstico</title>
  <meta name="description" content="Prototipo REM: descanso personal y convivencia en el hogar.">
  <style>
    :root{--cream:#f3e8d2;--paper:#fffaf0;--ink:#25372f;--muted:#708078;--line:#ded3bd;--terra:#bd5235;--yellow:#efb43d;--blue:#244fa7;--green:#637d62;--shadow:0 24px 70px #3f30251f;--radius:30px}
    body.night{--cream:#0c1830;--paper:#14223c;--ink:#f8f0df;--muted:#acb6c8;--line:#32405a;--shadow:0 28px 80px #02071170}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.25s}button,input{font:inherit;color:inherit}button{cursor:pointer}.page{max-width:1380px;margin:auto;padding:24px}.context{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}.context h1{font:900 28px/1 Georgia,serif;letter-spacing:-.03em;margin:0}.context p{font-size:12px;color:var(--muted);margin:5px 0 0}.mode{display:flex;gap:5px;padding:4px;border:1px solid var(--line);background:var(--paper);border-radius:16px}.mode button{border:0;background:transparent;padding:9px 15px;border-radius:11px;font-size:12px;font-weight:800}.mode button.active{background:var(--blue);color:white}
    .device{background:#d7cbb6;padding:11px;border-radius:38px;box-shadow:var(--shadow)}body.night .device{background:#26334a}.shell{min-height:760px;background:var(--paper);border:1px solid var(--line);border-radius:29px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}.header{padding:18px 22px 12px;border-bottom:1px solid var(--line)}.brandline{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font:900 25px/1 Georgia,serif;color:var(--ink)}.status{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800}.status i{width:8px;height:8px;border-radius:50%;background:var(--yellow)}.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.nav button{border:1px solid transparent;background:transparent;padding:10px 5px;border-radius:14px;display:flex;justify-content:center;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:800}.nav button span{font-size:18px}.nav button.active{background:var(--cream);border-color:var(--line);color:var(--ink)}
    main{padding:30px}.screen{max-width:1040px;margin:auto;animation:appear .2s ease}@keyframes appear{from{opacity:.3;transform:translateY(5px)}}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:900}.title{font:800 38px/1.05 Georgia,serif;letter-spacing:-.035em;margin:7px 0 8px}.subtitle{margin:0;color:var(--muted);font-size:14px}.section{margin-top:26px}.label{display:block;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{border:2px solid var(--line);background:transparent;min-height:142px;padding:18px;border-radius:22px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.choice .icon{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--cream);font-size:24px}.choice b{font-size:19px}.choice small{display:block;margin-top:4px;color:var(--muted)}.choice.active{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--paper))}.choice.active .icon{background:var(--blue);color:white}
    .segmented{display:grid;grid-template-columns:1fr 1fr;background:var(--cream);border-radius:17px;padding:5px;gap:5px;max-width:520px}.segmented button{border:0;background:transparent;border-radius:12px;padding:13px;font-weight:850}.segmented button.active{background:var(--paper);box-shadow:0 3px 14px #382d1a18;color:var(--blue)}.schedule{margin-top:14px;padding:19px;background:color-mix(in srgb,var(--yellow) 17%,var(--paper));border:1px solid color-mix(in srgb,var(--yellow) 50%,var(--line));border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.schedule strong{font-size:16px}.schedule small{display:block;color:var(--muted);margin-top:4px}.time{border:0;background:var(--paper);border-radius:14px;padding:12px 14px;font-weight:900;font-size:20px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.primary{width:100%;border:0;background:var(--terra);color:white;padding:16px 20px;border-radius:17px;font-weight:900;font-size:15px;margin-top:14px}.primary.blue{background:var(--blue)}.note{margin-top:12px;color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}.note i{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .overview{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.hero{background:var(--blue);color:white;border-radius:28px;padding:27px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between}.hero .moon{font-size:46px}.hero h2{font:800 35px/1.05 Georgia,serif;margin:0}.hero p{margin:6px 0 0;color:#dae4ff}.timeline,.programs,.panel{border:1px solid var(--line);border-radius:24px;padding:21px;background:color-mix(in srgb,var(--paper) 93%,var(--cream))}.timeline h3,.programs h3,.panel h3{margin:0 0 15px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.event{display:grid;grid-template-columns:58px 38px 1fr;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.event:first-of-type{border-top:0}.event time{font-weight:900}.event i{font-style:normal;font-size:20px}.event b{display:block}.event small{color:var(--muted)}.programs{grid-column:1/-1}.program-row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.program-row:first-of-type{border-top:0}.program-row i{font-style:normal;font-size:23px}.program-row b{display:block}.program-row small{color:var(--muted)}.edit{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;font-weight:900}
    .stepbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.step{border:1px solid var(--line);border-radius:22px;padding:20px}.step span{font-size:12px;font-weight:900;text-transform:uppercase}.step strong{display:block;font:800 36px/1 Georgia,serif;margin:16px 0}.stepper{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}.stepper button{border:1px solid var(--line);background:var(--cream);height:42px;border-radius:12px;font-size:20px}.stepper output{text-align:center;font-weight:900}.slider{width:100%;accent-color:var(--blue)}.toggle{width:52px;height:30px;border:0;border-radius:99px;background:var(--line);padding:3px}.toggle i{display:block;width:24px;height:24px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:var(--green)}.toggle.on i{transform:translateX(22px)}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:1px solid var(--line);border-radius:22px;padding:20px}.metric span{font-size:22px}.metric strong{display:block;font:800 30px/1 Georgia,serif;margin:15px 0 5px}.metric small{color:var(--muted)}.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feel button{border:1px solid var(--line);background:transparent;padding:14px;border-radius:15px;font-weight:850}.feel button.active{background:var(--green);color:white;border-color:var(--green)}.privacy{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--green) 13%,var(--paper));color:var(--green);padding:9px 12px;border-radius:99px;font-size:11px;font-weight:900}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:99px;font-weight:800;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .remi-launcher{position:fixed;right:26px;bottom:24px;z-index:40;border:0;background:var(--terra);color:white;border-radius:999px;padding:10px 18px 10px 10px;display:flex;align-items:center;gap:10px;font-weight:900;box-shadow:0 16px 36px #4d271d42}.remi-orb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#35230c;font:900 18px Georgia,serif;position:relative}.remi-orb::after{content:'';position:absolute;inset:-4px;border:1px solid #fff7;border-radius:50%}.voice-backdrop{position:fixed;inset:0;background:#08101f9e;backdrop-filter:blur(7px);z-index:50;display:grid;place-items:end center;padding:24px;opacity:0;pointer-events:none;transition:.2s}.voice-backdrop.open{opacity:1;pointer-events:auto}.voice-panel{width:min(540px,100%);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:30px;padding:23px;box-shadow:0 30px 90px #0007;transform:translateY(20px);transition:.2s}.voice-backdrop.open .voice-panel{transform:none}.voice-top{display:flex;justify-content:space-between;align-items:center}.voice-name{display:flex;align-items:center;gap:12px}.voice-name .remi-orb{width:44px;height:44px}.voice-name b{display:block;font:800 22px Georgia,serif}.voice-name small{color:var(--muted)}.voice-close{border:0;background:var(--cream);width:38px;height:38px;border-radius:50%;font-size:20px}.voice-bubble{margin:22px 0 14px;padding:18px;background:var(--cream);border-radius:20px;font:700 20px/1.3 Georgia,serif;min-height:78px}.voice-bubble.user{background:color-mix(in srgb,var(--blue) 12%,var(--paper));font:800 17px/1.3 Inter,sans-serif}.voice-actions{display:flex;flex-wrap:wrap;gap:8px}.voice-chip{border:1px solid var(--line);background:transparent;padding:10px 13px;border-radius:999px;font-size:12px;font-weight:800}.voice-mic{margin-top:18px;width:100%;border:0;border-radius:18px;background:var(--blue);color:white;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900}.voice-mic.listening{background:var(--terra)}.wave{display:flex;gap:3px;align-items:center;height:18px}.wave i{display:block;width:3px;height:7px;background:currentColor;border-radius:3px}.voice-mic.listening .wave i{animation:wave .65s ease-in-out infinite alternate}.voice-mic.listening .wave i:nth-child(2){animation-delay:.15s}.voice-mic.listening .wave i:nth-child(3){animation-delay:.3s}@keyframes wave{to{height:18px}}.now-playing{margin-top:14px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--green) 14%,var(--paper));display:flex;align-items:center;gap:10px;font-size:12px}.now-playing strong{display:block}.now-playing small{color:var(--muted)}
    @media(max-width:760px){.page{padding:10px}.context{align-items:flex-start}.context p{display:none}.device{padding:6px;border-radius:25px}.shell{border-radius:20px}.header{padding:15px 12px 9px}.nav{overflow:auto;display:flex}.nav button{min-width:82px;flex-direction:column;gap:2px}.nav button span{font-size:16px}main{padding:20px 15px}.title{font-size:31px}.overview,.cards,.stepbox,.metrics{grid-template-columns:1fr}.programs{grid-column:auto}.schedule{align-items:flex-start;flex-direction:column}.time{width:100%}.remi-launcher{right:14px;bottom:14px}.voice-backdrop{padding:10px}.voice-panel{padding:19px;border-radius:24px}}
  </style>
</head>
<body class="night">
  <div class="page">
    <div class="context"><div><h1>rem. comunidad</h1><p>Buenos Aires · 2050 · Hogar 7B</p></div><div class="mode" aria-label="Cambiar simulación"><button data-mode="day">☀ Día</button><button data-mode="night" class="active">☾ Noche</button></div></div>
    <div class="device"><div class="shell">
      <header class="header"><div class="brandline"><div class="logo">rem.</div><div class="status"><i></i><span id="statusText">Descanso protegido · 22:00–06:00</span></div></div><nav class="nav" id="nav"></nav></header>
      <main><div class="screen" id="screen"></div></main>
    </div></div>
  </div>
  <div class="toast" id="toast"></div>
  <button class="remi-launcher" id="remiLauncher" aria-label="Hablar con Remi"><span class="remi-orb">r.</span><span>Hola, Remi</span></button>
  <div class="voice-backdrop" id="voiceBackdrop" role="dialog" aria-modal="true" aria-label="Conversación con Remi"><div class="voice-panel" id="voicePanel"></div></div>
  <script>
    const state={mode:'night',screen:'home',kitchenItem:'coffee',kitchenWhen:'schedule',coffeeTime:'07:15',mealTime:'20:30',washTime:'06:00',washCycle:'quick',livingScene:'read',livingLight:35,showerMinutes:8,water:38,alarmTime:'07:10',whiteNoise:true,feeling:'tired',voiceOpen:false,voiceListening:false,voiceCommand:'',voiceReply:'Hola, Lucía. ¿Qué necesitás?',musicPlaying:false};
    const nav=[['home','⌂','Inicio'],['kitchen','☕','Cocina'],['laundry','◉','Lavado'],['living','◐','Living'],['bath','♨','Baño'],['sleep','☾','Dormir'],['personal','♡','Mi descanso']];
    const $=s=>document.querySelector(s), night=()=>state.mode==='night';
    function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.remove('show'),1800)}
    function title(k,t,s){return `<div class="eyebrow">${k}</div><h1 class="title">${t}</h1>${s?`<p class="subtitle">${s}</p>`:''}`}
    function home(){return `${title('Vivienda 7B',night()?'Buenas noches, Lucía':'Buen día, Lucía')}<div class="overview section"><div class="hero"><div class="moon">${night()?'☾':'☀'}</div><div><h2>${night()?'La casa está en calma':'La casa está activa'}</h2><p>${night()?'Hasta las 06:00':'Sin restricciones ahora'}</p></div></div><div class="timeline"><h3>Próximo en el edificio</h3><div class="event"><time>05:00</time><i>⌁</i><div><b>Limpieza de pasillo</b><small>Puede escucharse desde el dormitorio</small></div></div><div class="event"><time>06:00</time><i>☀</i><div><b>Finaliza la franja</b><small>Se activan las programaciones</small></div></div></div><div class="programs"><h3>Tus programaciones</h3><div class="program-row"><i>◉</i><div><b>Lavado rápido</b><small>La ropa estará lista al despertar</small></div><input class="edit" data-time="washTime" type="time" value="${state.washTime}"></div><div class="program-row"><i>☕</i><div><b>Café</b><small>Listo antes de salir</small></div><input class="edit" data-time="coffeeTime" type="time" value="${state.coffeeTime}"></div></div></div>`}
    function kitchen(){const item=state.kitchenItem,when=state.kitchenWhen,time=item==='coffee'?state.coffeeTime:state.mealTime;return `${title('Cocina','¿Qué querés preparar?')}<div class="cards section"><button class="choice ${item==='coffee'?'active':''}" data-kitem="coffee"><span class="icon">☕</span><span><b>Café</b><small>Una taza</small></span></button><button class="choice ${item==='meal'?'active':''}" data-kitem="meal"><span class="icon">◒</span><span><b>Comida</b><small>Una porción</small></span></button></div><div class="section"><span class="label">¿Cuándo?</span><div class="segmented"><button data-kwhen="now" class="${when==='now'?'active':''}">Ahora</button><button data-kwhen="schedule" class="${when==='schedule'?'active':''}">Programar</button></div>${when==='schedule'?`<div class="schedule"><div><strong>${item==='coffee'?'Café':'Comida'} listo a las</strong><small>Podés editar el horario</small></div><input class="time" data-time="${item==='coffee'?'coffeeTime':'mealTime'}" type="time" value="${time}"></div>`:''}<button class="primary" data-action="kitchen">${when==='schedule'?'Programar':'Preparar ahora'} ${item==='coffee'?'café':'comida'}</button>${night()?'<div class="note"><i></i>La cocina trabaja en modo silencioso durante la noche.</div>':''}</div>`}
    function laundry(){return `${title('Lavadero','¿Cuándo lavamos?',night()?'El primer horario silencioso disponible es a las 06:00.':'Elegí el momento que te resulte más cómodo.')}<div class="schedule section"><div><strong>Empezar a las</strong><small>Horario editable</small></div><input class="time" data-time="washTime" type="time" value="${state.washTime}"></div><div class="section"><span class="label">Ciclo</span><div class="segmented"><button data-cycle="quick" class="${state.washCycle==='quick'?'active':''}">Rápido · 45 min</button><button data-cycle="daily" class="${state.washCycle==='daily'?'active':''}">Diario · 1 h 15</button></div><button class="primary blue" data-action="wash">Programar lavado</button>${night()?'<div class="note"><i></i>Se iniciará cuando termine la franja protegida.</div>':''}</div>`}
    function living(){return `${title('Living','¿Qué querés hacer?')}<div class="cards section"><button class="choice ${state.livingScene==='read'?'active':''}" data-scene="read"><span class="icon">Aa</span><span><b>Leer</b><small>Luz cálida focal</small></span></button><button class="choice ${state.livingScene==='watch'?'active':''}" data-scene="watch"><span class="icon">▶</span><span><b>Ver algo</b><small>Luz baja</small></span></button></div><div class="panel section"><h3>Luz interior</h3><input class="slider" data-range="livingLight" type="range" min="10" max="100" value="${state.livingLight}"><div style="display:flex;justify-content:space-between;margin-top:8px"><small>Suave</small><strong id="lightValue">${state.livingLight}%</strong><small>Intensa</small></div></div><button class="primary" data-action="living">Activar escena</button>${night()?'<div class="note"><i></i>La luz del balcón permanece apagada hasta las 06:00.</div>':''}`}
    function bath(){return `${title('Baño','Preparar ducha')}<div class="stepbox section"><div class="step"><span>Duración</span><strong>${state.showerMinutes} min</strong><div class="stepper"><button data-step="showerMinutes" data-delta="-1">−</button><output>${state.showerMinutes}</output><button data-step="showerMinutes" data-delta="1">+</button></div></div><div class="step"><span>Temperatura</span><strong>${state.water}°</strong><div class="stepper"><button data-step="water" data-delta="-1">−</button><output>${state.water}°</output><button data-step="water" data-delta="1">+</button></div></div></div><button class="primary blue" data-action="bath">Preparar ducha</button>${night()?'<div class="note"><i></i>Temperatura nocturna máxima: 38°.</div>':''}`}
    function sleep(){return `${title('Dormitorio','Preparar el descanso')}<div class="panel section"><h3>Evento que puede interrumpirte</h3><div class="event"><time>05:00</time><i>⌁</i><div><b>Limpieza de pasillo</b><small>Ruido estimado: 48 dB</small></div></div><div class="program-row"><i>≋</i><div><b>Ruido blanco</b><small>Reduce el impacto del pasillo</small></div><button class="toggle ${state.whiteNoise?'on':''}" data-toggle="whiteNoise" aria-label="Activar ruido blanco"><i></i></button></div></div><div class="schedule section"><div><strong>Despertarme a las</strong><small>Horario editable</small></div><input class="time" data-time="alarmTime" type="time" value="${state.alarmTime}"></div><button class="primary" data-action="sleep">Activar modo descanso</button>`}
    function personal(){return `${title('Solo en tu teléfono','Mi descanso')}<div class="privacy section">▣ Datos privados de Lucía</div><div class="metrics section"><div class="metric"><span>☾</span><strong>6 h 12</strong><small>Dormiste</small></div><div class="metric"><span>◌</span><strong>84%</strong><small>Continuidad</small></div><div class="metric"><span>⌁</span><strong>05:00</strong><small>Interrupción</small></div></div><div class="section"><span class="label">¿Cómo te sentís ahora?</span><div class="feel"><button data-feel="good" class="${state.feeling==='good'?'active':''}">Bien</button><button data-feel="tired" class="${state.feeling==='tired'?'active':''}">Cansada</button><button data-feel="exhausted" class="${state.feeling==='exhausted'?'active':''}">Agotada</button></div><div class="note"><i></i>Tu respuesta queda solamente en este teléfono.</div></div>`}
    const views={home,kitchen,laundry,living,bath,sleep,personal};
    function render(){document.body.classList.toggle('night',night());document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode));$('#statusText').textContent=night()?'Descanso protegido · 22:00–06:00':'Horario de día · sin restricciones';$('#nav').innerHTML=nav.map(([id,ic,n])=>`<button data-screen="${id}" class="${state.screen===id?'active':''}"><span>${ic}</span>${n}</button>`).join('');$('#screen').innerHTML=views[state.screen]();bind()}
    function bind(){document.querySelectorAll('[data-screen]').forEach(x=>x.onclick=()=>{state.screen=x.dataset.screen;render()});document.querySelectorAll('[data-kitem]').forEach(x=>x.onclick=()=>{state.kitchenItem=x.dataset.kitem;render()});document.querySelectorAll('[data-kwhen]').forEach(x=>x.onclick=()=>{state.kitchenWhen=x.dataset.kwhen;render()});document.querySelectorAll('[data-cycle]').forEach(x=>x.onclick=()=>{state.washCycle=x.dataset.cycle;render()});document.querySelectorAll('[data-scene]').forEach(x=>x.onclick=()=>{state.livingScene=x.dataset.scene;render()});document.querySelectorAll('[data-time]').forEach(x=>x.onchange=()=>{state[x.dataset.time]=x.value;toast('Horario guardado')});document.querySelectorAll('[data-range]').forEach(x=>x.oninput=()=>{state[x.dataset.range]=+x.value;const o=$('#lightValue');if(o)o.textContent=x.value+'%'});document.querySelectorAll('[data-step]').forEach(x=>x.onclick=()=>{const k=x.dataset.step,d=+x.dataset.delta,min=k==='water'?32:3,max=k==='water'?(night()?38:42):20;state[k]=Math.max(min,Math.min(max,state[k]+d));render()});document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{state[x.dataset.toggle]=!state[x.dataset.toggle];render()});document.querySelectorAll('[data-feel]').forEach(x=>x.onclick=()=>{state.feeling=x.dataset.feel;render();toast('Registro guardado en tu teléfono')});document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>{const messages={kitchen:state.kitchenWhen==='schedule'?`${state.kitchenItem==='coffee'?'Café':'Comida'} programado`:'Preparación iniciada',wash:`Lavado programado para las ${state.washTime}`,living:'Escena activada',bath:'Ducha preparada',sleep:'Modo descanso activado'};toast(messages[x.dataset.action])})}
    function voiceView(){return `<div class="voice-top"><div class="voice-name"><span class="remi-orb">r.</span><div><b>Remi</b><small>Asistente del hogar</small></div></div><button class="voice-close" data-voice-close aria-label="Cerrar">×</button></div>${state.voiceCommand?`<div class="voice-bubble user">“${state.voiceCommand}”</div>`:''}<div class="voice-bubble">${state.voiceListening?'Te escucho…':state.voiceReply}</div>${!state.voiceCommand?`<div class="voice-actions"><button class="voice-chip" data-command="Música para dormir">♫ Música para dormir</button><button class="voice-chip" data-command="¿Qué pasa a las cinco?">⌁ ¿Qué pasa a las 5?</button><button class="voice-chip" data-command="¿A qué hora está el café?">☕ ¿A qué hora está el café?</button></div>`:''}${state.musicPlaying?'<div class="now-playing"><span>♫</span><div><strong>Noche tranquila</strong><small>Volumen suave · se detiene con la alarma</small></div></div>':''}<button class="voice-mic ${state.voiceListening?'listening':''}" data-voice-listen><span class="wave"><i></i><i></i><i></i></span>${state.voiceListening?'Escuchando…':'Hablar con Remi'}</button>`}
    function renderVoice(){const back=$('#voiceBackdrop');back.classList.toggle('open',state.voiceOpen);$('#voicePanel').innerHTML=voiceView();document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>answerVoice(x.dataset.command));const close=document.querySelector('[data-voice-close]');if(close)close.onclick=closeVoice;const listen=document.querySelector('[data-voice-listen]');if(listen)listen.onclick=startListening}
    function speak(text){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-AR';u.rate=.96;speechSynthesis.speak(u)}}
    function answerVoice(command){state.voiceListening=false;state.voiceCommand=command;const c=command.toLowerCase();if(c.includes('música')||c.includes('musica')||c.includes('dormir')){state.musicPlaying=true;state.whiteNoise=false;state.voiceReply='Listo. Puse música suave para dormir. Se apaga con tu alarma de las '+state.alarmTime+'.'}else if(c.includes('cinco')||c.includes('5')||c.includes('limpieza')){state.voiceReply='A las 05:00 limpian el pasillo. Si querés, puedo activar ruido blanco antes de esa hora.'}else if(c.includes('café')||c.includes('cafe')){state.voiceReply='Tu café está programado para las '+state.coffeeTime+'. Así dormís un poco más.'}else if(c.includes('lavado')||c.includes('ropa')){state.voiceReply='El lavado empieza a las '+state.washTime+' y estará listo cuando te levantes.'}else{state.voiceReply='Puedo ayudarte con el descanso, el café, el lavado o los eventos del edificio.'}renderVoice();speak(state.voiceReply)}
    function startListening(){state.voiceListening=true;state.voiceCommand='';state.voiceReply='';renderVoice();const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(Recognition){const r=new Recognition();r.lang='es-AR';r.interimResults=false;r.onresult=e=>answerVoice(e.results[0][0].transcript);r.onerror=()=>{state.voiceListening=false;state.voiceReply='No llegué a escucharte. Probá de nuevo o elegí una opción.';renderVoice()};r.start()}else{setTimeout(()=>answerVoice('Música para dormir'),900)}}
    function closeVoice(){state.voiceOpen=false;state.voiceListening=false;renderVoice()}
    $('#remiLauncher').onclick=()=>{state.voiceOpen=true;state.voiceCommand='';state.voiceReply='Hola, Lucía. ¿Qué necesitás?';renderVoice()};$('#voiceBackdrop').onclick=e=>{if(e.target.id==='voiceBackdrop')closeVoice()};
    document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{state.mode=x.dataset.mode;if(night()){state.washTime='06:00';state.water=Math.min(38,state.water);state.kitchenWhen='schedule'}render()});render();renderVoice();
  </script>
</body>
</html>
